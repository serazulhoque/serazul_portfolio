<!--
USAGE / ROUTING
Save as admin.html. Open admin.html?access=hoque15062002 locally or on a host.
For /hoque15062002, configure an INTERNAL hosting rewrite to serve admin.html
at that exact path. A static file cannot create that server route by itself.
Do not add this page to public navigation, footers or sitemaps.

SECURITY BOUNDARY
This is a UI prototype, NOT production authentication. The route key and every
client check are readable/bypassable. Hidden paths are security through obscurity.
Login intentionally accepts any valid demo email and a 12+ character dummy
password after explicit demo consent. No credentials/tokens are saved. Articles
and settings are memory-only; refresh/logout resets them. Nothing publishes live.

ROBOTS.TXT (separate root file; not created by this HTML)
  User-agent: *
  Disallow: /admin.html
  Disallow: /hoque15062002
Disallow discourages compliant crawling; it DOES NOT guarantee non-indexing or
confidentiality, and it reveals the paths publicly. A disallowed crawler may not
see noindex. Use server authentication and X-Robots-Tag: noindex/no-store headers
as appropriate. Keep the noindex meta tag above; use real access controls.

PRODUCTION BACKEND / LIVE PUBLISHING: SUPABASE EXAMPLE
1. Create a Supabase project (free tier subject to its current quotas). Configure
   email Auth, invite-only admins, verified emails, exact redirect URLs and TOTP
   MFA. Never treat knowledge of the hidden URL as admin authorization.
2. Add a same-origin HTTPS backend. Replace handleLogin() with the backend's
   login/MFA flow. Verify provider JWT signature, issuer, audience, expiry and MFA
   assurance (aal2) server-side. Decoding JWT payloads is NOT verification.
3. Keep approved admin IDs in protected server-managed data/trusted claims.
   Never authorize using user-editable metadata or isAdmin supplied by a browser.
   Authenticate AND authorize every read/write/upload/password API request.
4. Store articles as {id,title,status,document,updated_at}. document is the
   allowlisted JSON tree produced by readDocument(), including per-node font,
   size, color, alignment and emphasis. Validate this schema and size/depth/node
   limits again on the backend. Store site metadata in a separate settings table.
5. Enable database RLS and private Storage policies, restricting mutations to
   approved admin IDs with required MFA. Give the public site read access ONLY
   to explicitly published articles and deliberately public metadata/media.
6. Replace the demo save/delete handlers with authorized API operations. Public
   pages fetch published documents and render them using the same allowlist-based
   DOM renderer (or equivalent server renderer), NOT raw innerHTML from a DB.
   An admin login alone does not grant database/storage permissions.
7. Load the SAME font-face definitions on editor AND public site. Persist the
   allowlisted font identifier/family with each node. Font CSS/files belong in
   trusted, versioned assets; never accept arbitrary font CSS/URLs from articles.
8. Prefer Secure, HttpOnly, SameSite session cookies via the backend. Protect
   cookie-based mutations with CSRF tokens and Origin checks. Rate-limit login,
   enforce server expiry/revocation, audit mutations, and require recent MFA for
   credential changes. Never store a service-role key or password in this HTML.
9. Upload to private storage via authorized APIs. Verify actual bytes/MIME, size,
   image dimensions and access server-side; re-encode images, randomize filenames
   and scan as appropriate. Client MIME checks are bypassable. Use signed URLs
   for private assets. Serve untrusted content from a separate safe origin.
10. Test anonymous/non-admin requests, direct API access, expired tokens, stored
    XSS and authorization policies. Protect serving the admin HTML at the edge
    too if even the UI source must be private. Add backups and monitoring.

FONT SYNC (optional, NOT enabled; this file works offline with fallbacks)
The dropdown includes Inter, Roboto, Playfair Display, Open Sans, Montserrat,
Cardo and web-safe fonts. Named fonts use fallbacks until installed or loaded.
For exact offline matching, embed licensed WOFF2 bytes as a data: font-face in
this style block and allow font-src data: in CSP. Use the same CSS publicly:
  @font-face { font-family: 'Cardo'; font-style: normal; font-weight: 400;
    font-display: swap; src: url('data:font/woff2;base64,YOUR_FONT_BYTES') format('woff2'); }
For hosted fonts, put trusted font files under /fonts and use font-src 'self'.
Alternatively add a Google Fonts stylesheet to BOTH pages, e.g. Inter/Roboto/
Playfair Display/Open Sans/Montserrat. Then permit https://fonts.googleapis.com
in style-src and https://fonts.gstatic.com in font-src. Do not enable arbitrary
remote origins or reuse another site's paid font kit without your own license.
Keep the FONTS map and server/public renderer allowlists synchronized.

Docs: https://supabase.com/docs/guides/auth
https://supabase.com/docs/guides/database/postgres/row-level-security

<script>
"use strict";
(() => {
const KEY="hoque15062002", root=document.getElementById("root"), $=id=>document.getElementById(id);
const FONTS={system:"system-ui, sans-serif",arial:"Arial, sans-serif",georgia:"Georgia, serif",times:"Times New Roman, serif",verdana:"Verdana, sans-serif",courier:"Courier New, monospace",inter:"Inter, system-ui, sans-serif",roboto:"Roboto, Arial, sans-serif",playfair:"Playfair Display, Georgia, serif",opensans:"Open Sans, Arial, sans-serif",montserrat:"Montserrat, Arial, sans-serif",cardo:"Cardo, Georgia, serif"};
const FONT_LABELS={system:"System UI",arial:"Arial",georgia:"Georgia",times:"Times New Roman",verdana:"Verdana",courier:"Courier New",inter:"Inter",roboto:"Roboto",playfair:"Playfair Display",opensans:"Open Sans",montserrat:"Montserrat",cardo:"Cardo (site heading font)"};
const TAGS=new Set(["p","div","span","strong","b","em","i","br","ul","ol","li","h2","h3","blockquote"]);
const BLOCKED=new Set(["script","style","iframe","object","embed","svg","math","img","video","audio","link","meta","template"]);
let authenticated=false, editing=null, articles=[], media=[], activities=[], settings={title:"Serazul Hoque",description:"Software, with a human purpose.",email:""}, counter=0, selectionRange=null, snapshots=[], historyIndex=-1, idle=0, toastTimer=0;
const blankDocument=()=>[{type:"p",styles:{},children:[{type:"br",styles:{},children:[]}]}];
function allowed(){const u=new URL(location.href);return u.pathname.replace(/\/+$/,"")==="/"+KEY||u.searchParams.get("access")===KEY;}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function clean(s,max=20000){return String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,"").trim().slice(0,max);}
function mount(id){root.className="";root.replaceChildren($(id).content.cloneNode(true));}
function notify(message){clearTimeout(toastTimer);$("toast").textContent=message;toastTimer=setTimeout(()=>$("toast").textContent="",4500);}
function log(message){activities.unshift({message,time:new Date()});activities=activities.slice(0,20);renderStats();}
function armIdle(){clearTimeout(idle);if(authenticated)idle=setTimeout(()=>logout("Demo session expired."),15*60*1000);}
function loginValid(){return $("email").validity.valid&&$("email").value.trim()!==""&&$("password").value.length>=12&&$("password").value.length<=128&&$("consent").checked;}
async function handleLogin(event){
 event.preventDefault();if(!allowed()||!loginValid())return;
 const email=clean($("email").value,254), password=$("password").value;$("login-submit").disabled=true;
 try{
  /* PRODUCTION REPLACEMENT:
   const result=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json','X-CSRF-Token':csrfFromBackend},
    body:JSON.stringify({email,password})});
   Backend must authenticate via your provider, complete MFA, verify signed JWT/
   OAuth identity, check trusted admin membership and issue a secure session.
   Handle challenge/failure before mounting the dashboard. Recheck authorization
   on EVERY subsequent API operation. Never embed secrets or trust this boolean.
   Change CSP connect-src to the actual trusted API origin when integrating. */
  await Promise.resolve(); // DEMO ONLY: no network, no JWT, any valid dummy credentials.
  if(!allowed())return;$("password").value="";authenticated=true;showDashboard(email);
 }catch{if($("login-error"))$("login-error").textContent="Unable to sign in.";}
 finally{if($("password"))$("password").value="";if($("login-submit"))$("login-submit").disabled=!loginValid();}
}
function showLogin(){mount("login-template");$("login-form").addEventListener("submit",handleLogin);$("login-form").addEventListener("input",()=>$("login-submit").disabled=!loginValid());$("show-password").onclick=()=>{const show=$("password").type==="password";$("password").type=show?"text":"password";$("show-password").textContent=show?"Hide":"Show";$("show-password").setAttribute("aria-pressed",String(show));};}
function logout(message="Logged out. Demo data cleared."){authenticated=false;clearTimeout(idle);media.forEach(m=>URL.revokeObjectURL(m.url));articles=[];media=[];activities=[];editing=null;selectionRange=null;snapshots=[];historyIndex=-1;settings={title:"Serazul Hoque",description:"Software, with a human purpose.",email:""};if(allowed())showLogin();else{root.className="center";root.replaceChildren(el("h1","404 — Page not found"));}notify(message);}

// The persisted format is a restricted JSON tree, NOT arbitrary HTML.
// All user strings use textContent/value. No user data enters innerHTML, eval,
// URLs or CSS text. Paste is plain text; untrusted attributes are never copied.
function safeStyles(style){
 const out={}, norm=s=>String(s).replace(/["']/g,"").replace(/\s+/g," ").trim().toLowerCase();
 const font=Object.values(FONTS).find(f=>norm(f)===norm(style.fontFamily));if(font)out.fontFamily=font;
 if(/^\d+(\.\d+)?px$/.test(style.fontSize)&&parseFloat(style.fontSize)>=8&&parseFloat(style.fontSize)<=96)out.fontSize=style.fontSize;
 if(["normal","bold","400","700"].includes(style.fontWeight))out.fontWeight=style.fontWeight;
 if(["normal","italic"].includes(style.fontStyle))out.fontStyle=style.fontStyle;
 if(["left","center","right","justify"].includes(style.textAlign))out.textAlign=style.textAlign;
 const color=String(style.color||"");
 if(/^#[0-9a-f]{6}$/i.test(color))out.color=color;
 else{const m=color.match(/^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/);if(m&&m.slice(1).every(v=>+v<=255))out.color=color;}
 return out;
}
function readDocument(){
 let count=0,remaining=20000;
 function visit(n,depth){
  if(++count>3000||depth>20||remaining<=0)return [];
  if(n.nodeType===Node.TEXT_NODE){const text=n.data.slice(0,remaining).replace(/\u0000/g,"");remaining-=text.length;return [{type:"text",text}];}
  if(n.nodeType!==Node.ELEMENT_NODE)return [];
  const type=n.tagName.toLowerCase();if(BLOCKED.has(type))return [];
  const children=Array.from(n.childNodes).flatMap(c=>visit(c,depth+1));
  return TAGS.has(type)?[{type,styles:safeStyles(n.style),children}]:children;
 }
 return Array.from($("editor").childNodes).flatMap(n=>visit(n,0));
}
function renderDocument(target,doc){
 target.replaceChildren();let count=0,remaining=20000;
 function build(item,depth){
  if(!item||++count>3000||depth>20||remaining<=0)return document.createTextNode("");
  if(item.type==="text"){const text=String(item.text||"").slice(0,remaining);remaining-=text.length;return document.createTextNode(text);}
  if(!TAGS.has(item.type))return document.createTextNode("");
  const n=el(item.type);Object.assign(n.style,safeStyles(item.styles||{}));
  (Array.isArray(item.children)?item.children:[]).forEach(child=>n.append(build(child,depth+1)));return n;
 }
 (Array.isArray(doc)?doc:[]).forEach(item=>target.append(build(item,0)));
}
function rememberSelection(){const s=window.getSelection();if(s.rangeCount&&$("editor")&&$("editor").contains(s.getRangeAt(0).commonAncestorContainer))selectionRange=s.getRangeAt(0).cloneRange();}
function caretAtEnd(){const r=document.createRange();r.selectNodeContents($("editor"));r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r);selectionRange=r.cloneRange();}
function activeRange(){const ed=$("editor");ed.focus();let r=selectionRange?.cloneRange();if(!r||!ed.contains(r.commonAncestorContainer)){r=document.createRange();r.selectNodeContents(ed);r.collapse(false);}if($("scope").value==="all")r.selectNodeContents(ed);const s=window.getSelection();s.removeAllRanges();s.addRange(r);return r;}
function selectedBlocks(r){
 const ed=$("editor"), all=Array.from(ed.querySelectorAll("p,div,h2,h3,blockquote,li")).filter(n=>n.parentElement===ed||(n.tagName==="LI"&&n.parentElement.parentElement===ed));
 if(r.collapsed){let n=r.startContainer.nodeType===3?r.startContainer.parentElement:r.startContainer;while(n&&n!==ed){if(all.includes(n))return[n];n=n.parentElement;}if(!ed.firstChild){const p=el("p");p.append(el("br"));ed.append(p);return[p];}return all.length?[all[all.length-1]]:[];}
 return all.filter(n=>r.intersectsNode(n));
}
function commit(){const snapshot=JSON.stringify(readDocument());if(snapshots[historyIndex]!==snapshot){snapshots=snapshots.slice(0,historyIndex+1);snapshots.push(snapshot);if(snapshots.length>50)snapshots.shift();historyIndex=snapshots.length-1;}updateEditorMeta();}
function updateEditorMeta(){const words=($("editor").innerText||$("editor").textContent).trim().split(/\s+/).filter(Boolean).length;$("word-count").textContent=words+" words · "+$("editor").textContent.length+" / 20,000 characters";$("undo").disabled=historyIndex<=0;$("redo").disabled=historyIndex>=snapshots.length-1;}
function applyStyle(property,value){
 const r=activeRange(),blocks=selectedBlocks(r);
 if(r.collapsed||$("scope").value==="all"){blocks.forEach(b=>{b.style[property]=value;b.querySelectorAll("*").forEach(child=>child.style[property]=value);});rememberSelection();commit();return;}
 // Wrap individual selected text fragments, never place block elements in spans.
 const walker=document.createTreeWalker($("editor"),NodeFilter.SHOW_TEXT),parts=[];let n;
 while(n=walker.nextNode())if(r.intersectsNode(n)){const start=n===r.startContainer?r.startOffset:0,end=n===r.endContainer?r.endOffset:n.length;if(end>start)parts.push({n,start,end});}
 let first=null,last=null;
 for(const part of parts){let t=part.n;if(part.end<t.length)t.splitText(part.end);if(part.start)t=t.splitText(part.start);if(t.parentElement.tagName==="SPAN"&&t.parentElement.childNodes.length===1){t.parentElement.style[property]=value;}else{const span=el("span");span.style[property]=value;t.replaceWith(span);span.append(t);}first=first||t;last=t;}
 if(first){const nr=document.createRange();nr.setStart(first,0);nr.setEnd(last,last.length);const s=window.getSelection();s.removeAllRanges();s.addRange(nr);selectionRange=nr.cloneRange();}commit();
}
function toggleEmphasis(kind){const r=activeRange();const n=r.startContainer.nodeType===3?r.startContainer.parentElement:r.startContainer;const style=getComputedStyle(n);if(kind==="bold")applyStyle("fontWeight",+style.fontWeight>=600?"400":"700");else applyStyle("fontStyle",style.fontStyle==="italic"?"normal":"italic");}
function align(value){selectedBlocks(activeRange()).forEach(b=>b.style.textAlign=value);rememberSelection();commit();}
function bullets(){
 const blocks=selectedBlocks(activeRange());if(!blocks.length)return;
 const lists=[...new Set(blocks.filter(b=>b.tagName==="LI").map(b=>b.parentElement))];
 if(lists.length){
  // List toggling operates on the entire selected list block.
  lists.forEach(list=>{const f=document.createDocumentFragment();Array.from(list.children).forEach(li=>{const p=el("p");Object.assign(p.style,safeStyles(li.style));p.append(...li.childNodes);f.append(p);});list.replaceWith(f);});
 }else{const roots=blocks.filter(b=>b.parentElement===$("editor"));if(!roots.length)return;const ul=el("ul");roots[0].before(ul);roots.forEach(b=>{const li=el("li");Object.assign(li.style,safeStyles(b.style));li.append(...b.childNodes);ul.append(li);b.remove();});}
 caretAtEnd();commit();
}
function historyStep(delta){const next=historyIndex+delta;if(next<0||next>=snapshots.length)return;historyIndex=next;renderDocument($("editor"),JSON.parse(snapshots[next]));caretAtEnd();updateEditorMeta();}
function resetEditor(doc=blankDocument()){selectionRange=null;renderDocument($("editor"),doc);snapshots=[];historyIndex=-1;commit();}
function newArticle(){editing=null;$("article-form").reset();$("editor-title").textContent="Create article";$("delete-article").disabled=true;resetEditor();$("article-title").focus();}
function installEditor(){
 Object.entries(FONTS).forEach(([key,font])=>{const o=el("option",FONT_LABELS[key]);o.value=key;o.style.fontFamily=font;$("font").append(o);});$("font").value="georgia";
 $("toolbar").addEventListener("pointerdown",e=>{if(e.target.closest("button"))e.preventDefault();});
 $("font").onchange=()=>applyStyle("fontFamily",FONTS[$("font").value]);$("size").onchange=()=>applyStyle("fontSize",$("size").value+"px");$("color").onchange=()=>applyStyle("color",$("color").value);
 document.querySelectorAll("[data-format]").forEach(b=>b.onclick=()=>toggleEmphasis(b.dataset.format));document.querySelectorAll("[data-align]").forEach(b=>b.onclick=()=>align(b.dataset.align));$("bullets").onclick=bullets;$("undo").onclick=()=>historyStep(-1);$("redo").onclick=()=>historyStep(1);
 $("editor").addEventListener("input",()=>{if($("editor").textContent.length>20000){renderDocument($("editor"),JSON.parse(snapshots[historyIndex]));caretAtEnd();notify("Article limit: 20,000 characters.");}rememberSelection();commit();});
 $("editor").addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey){const k=e.key.toLowerCase();if(["b","i","z","y"].includes(k)){e.preventDefault();if(k==="b"||k==="i")toggleEmphasis(k==="b"?"bold":"italic");else historyStep(k==="y"||e.shiftKey?1:-1);}}});
 $("editor").addEventListener("paste",e=>{e.preventDefault();const text=(e.clipboardData?.getData("text/plain")||"").slice(0,20000-$("editor").textContent.length);const s=window.getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0);if(!$("editor").contains(r.commonAncestorContainer))return;r.deleteContents();const f=document.createDocumentFragment();text.split(/\r?\n/).forEach((line,i)=>{if(i)f.append(el("br"));f.append(document.createTextNode(line));});const last=f.lastChild;if(last){r.insertNode(f);r.setStartAfter(last);r.collapse(true);s.removeAllRanges();s.addRange(r);}rememberSelection();commit();});
 $("editor").addEventListener("drop",e=>e.preventDefault());
 $("preview").onclick=()=>{$("preview-title").textContent=clean($("article-title").value,120)||"Article preview";renderDocument($("preview-content"),readDocument());$("preview-dialog").showModal();};$("close-preview").onclick=()=>$("preview-dialog").close();resetEditor();
}
function renderStats(){if(!$("total-count"))return;$("total-count").textContent=articles.length;$("draft-count").textContent=articles.filter(a=>a.status==="draft").length;$("media-count").textContent=media.length;$("activity").replaceChildren();activities.forEach(a=>{const li=el("li");li.append(el("p",a.message),el("small",a.time.toLocaleString()));$("activity").append(li);});}
function renderArticles(){$("article-list").replaceChildren();if(!articles.length)$("article-list").append(el("li","No articles yet.","muted"));articles.forEach(a=>{const li=el("li"),b=el("button","Edit","btn");li.append(el("strong",a.title),el("small",a.status+" · "+a.updated.toLocaleString()));b.type="button";b.setAttribute("aria-label","Edit "+a.title);b.onclick=()=>{editing=a.id;$("article-title").value=a.title;$("article-status").value=a.status;$("editor-title").textContent="Edit article";$("delete-article").disabled=false;resetEditor(a.document);$("article-title").focus();};li.append(b);$("article-list").append(li);});}
function receiveImages(files){const errors=[],types={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp"};for(const file of files){const ext=file.name.split(".").pop().toLowerCase();if(types[ext]!==file.type||!types[ext]){errors.push(file.name+": PNG, JPEG or WEBP only.");continue;}if(!file.size||file.size>5*1024*1024){errors.push(file.name+": maximum 5 MiB, nonempty.");continue;}if(media.length>=12||media.reduce((s,m)=>s+m.file.size,0)+file.size>25*1024*1024){errors.push("Image library limit reached.");break;}media.push({id:++counter,file,url:URL.createObjectURL(file)});log("Added demo image: "+clean(file.name,150));}$("media-error").textContent=errors.join(" ");$("files").value="";renderMedia();}
function renderMedia(){$("media-grid").replaceChildren();media.forEach(m=>{const card=el("article",undefined,"media-card"),img=el("img"),remove=el("button","Remove","btn danger");img.src=m.url;img.alt=clean(m.file.name,150);img.onerror=()=>img.replaceWith(el("p","Invalid image / preview unavailable."));remove.onclick=()=>{URL.revokeObjectURL(m.url);media=media.filter(x=>x.id!==m.id);renderMedia();log("Removed a demo image.");};card.append(img,el("p",clean(m.file.name,150)),remove);$("media-grid").append(card);});}
function switchView(name){if(!authenticated)return;const titles={overview:"Overview",content:"Create / Edit Content",media:"Media Uploader",settings:"Site Settings"};document.querySelectorAll(".view").forEach(n=>n.hidden=n.id!==name);document.querySelectorAll(".nav").forEach(n=>{if(n.dataset.view===name)n.setAttribute("aria-current","page");else n.removeAttribute("aria-current");});$("view-title").textContent=titles[name];$("view-title").focus();}
function showDashboard(email){
 mount("dashboard-template");$("identity").textContent="Demo: "+email;$("logout").onclick=()=>logout();document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>switchView(b.dataset.view));installEditor();renderArticles();renderMedia();$("new-article").onclick=newArticle;
 $("article-form").onsubmit=e=>{e.preventDefault();const title=clean($("article-title").value,120),doc=readDocument();if(!title||!$("editor").textContent.trim())return notify("A title and article content are required.");const a={id:editing??++counter,title,status:$("article-status").value==="published"?"published":"draft",document:doc,updated:new Date()};const index=articles.findIndex(x=>x.id===a.id);if(index<0)articles.unshift(a);else articles[index]=a;log("Saved demo article: "+title);renderArticles();editing=a.id;$("delete-article").disabled=false;$("editor-title").textContent="Edit article";notify("Article and font styles saved in this tab only.");};
 $("delete-article").onclick=()=>{if(editing===null||!confirm("Delete this demo article?"))return;articles=articles.filter(a=>a.id!==editing);newArticle();renderArticles();log("Deleted a demo article.");};
 $("choose-files").onclick=()=>$("files").click();$("files").onchange=e=>receiveImages(e.target.files);$("drop-zone").ondragover=e=>{e.preventDefault();$("drop-zone").classList.add("over");};$("drop-zone").ondragleave=()=>$("drop-zone").classList.remove("over");$("drop-zone").ondrop=e=>{e.preventDefault();$("drop-zone").classList.remove("over");receiveImages(e.dataTransfer.files);};
 $("site-title").value=settings.title;$("site-description").value=settings.description;$("site-email").value=settings.email;$("admin-email").value=email;
 $("settings-form").onsubmit=e=>{e.preventDefault();const title=clean($("site-title").value,120),description=clean($("site-description").value,160);if(!title||!description)return notify("Title and description cannot be blank.");settings={title,description,email:clean($("site-email").value,254)};log("Saved demo site settings.");notify("Settings saved in this tab only.");};
 $("credentials-form").onsubmit=e=>{e.preventDefault();const next=$("new-password").value;if(next!==$("confirm-password").value){$("credentials-error").textContent="New passwords do not match.";return;}if(next===$("current-password").value){$("credentials-error").textContent="Use a different new dummy password.";return;}/* Production: reauthenticate + MFA, then call provider-backed credential APIs. */$("credentials-form").reset();$("credentials-error").textContent="";notify("Validation passed. No account or password was changed.");};
 log("Opened the rich-text admin demo.");armIdle();$("view-title").focus();
}
document.addEventListener("selectionchange",rememberSelection);document.addEventListener("pointerdown",armIdle,{passive:true});document.addEventListener("keydown",armIdle);document.addEventListener("dragover",e=>e.preventDefault());document.addEventListener("drop",e=>e.preventDefault());window.addEventListener("beforeunload",()=>media.forEach(m=>URL.revokeObjectURL(m.url)));
function routeChanged(){if(!allowed())logout("Access route closed.");else if(!authenticated)showLogin();}window.addEventListener("popstate",routeChanged);window.addEventListener("hashchange",routeChanged);if(allowed())showLogin();
})();
</script>
