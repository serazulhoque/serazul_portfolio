name: Navigation browser tests

on:
  push:
    branches: [main]
    paths:
      - 'src/site-header.tsx'
      - 'test/navigation.browser.spec.mjs'
      - '.github/workflows/navigation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install website dependencies
        run: npm ci
      - name: Install temporary browser test dependencies
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build website
        run: npm run build
      - name: Serve built website
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1
      - name: Test desktop, mobile and tablet navigation
        run: npx playwright test test/navigation.browser.spec.mjs --reporter=list
