<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.siteFresh="loading";</script>
<style>
#site-content-loading{display:none}
html[data-site-fresh="loading"] #root,html[data-site-fresh="error"] #root{visibility:hidden}
html[data-site-fresh="loading"] #site-content-loading,html[data-site-fresh="error"] #site-content-loading{
display:block;position:fixed;z-index:999;top:36%;left:50%;transform:translateX(-50%);
box-sizing:border-box;width:min(90vw,480px);padding:24px;
background:var(--paper,#fffefa);color:var(--ink,#21332c);font:16px/1.6 Georgia,serif;
text-align:center;border-radius:8px;border:1px solid #d7dfd2}
#site-content-loading a{display:inline-block;margin-top:12px;color:inherit;text-decoration:underline}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes" />
<title>About Me — Serazul Hoque</title>
<meta name="description" content="Learn about Serazul Hoque, his software engineering journey, and his interest in accessible technology and useful AI." />
<meta property="og:title" content="About Me — Serazul Hoque" />
<meta property="og:description" content="A personal portfolio at the intersection of software engineering, language, and useful AI." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#21332c" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://serazul-backend.vercel.app" crossorigin />
<link rel="preconnect" href="https://krtnmzfucyfgalxvnuwj.supabase.co" crossorigin />
<script>try{var t=localStorage.getItem("serazul-theme");document.documentElement.dataset.theme=t==="dark"||t==="light"?t:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}</script>

<script>
  const url = new URL(window.location.href);
  url.searchParams.delete('utm_source');
  window.history.replaceState({}, '', url.toString());
</script>
</head>
<body>
<div id="site-content-loading" role="status" aria-live="polite">Loading the latest website content…</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
